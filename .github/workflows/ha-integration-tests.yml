name: Home Assistant integration tests
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ha:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install matching HA test framework
        run: python -m pip install pytest-homeassistant==2026.11.3 voluptuous-serialize
      - name: Test integration in isolated HA
        run: python -m pytest -v ha_tests
