name: Offline tests
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile integration
        run: python -m compileall -q custom_components tests
      - name: Test API, attendance model and terminal logic
        run: python -m unittest discover -s tests -v
      - name: Check dashboard JavaScript syntax
        run: |
          node --check frontend/staff-preview.js
          node --check frontend/staff-live.js
